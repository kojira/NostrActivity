name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify Node runtime and Brotli
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import { brotliCompressSync, brotliDecompressSync } from 'node:zlib'; assert.equal(process.versions.node, '22.23.4'); const input = Buffer.from('runtime smoke'); assert.deepEqual(brotliDecompressSync(brotliCompressSync(input)), input); console.log(process.version, process.execPath);"
      - run: npm ci
      - run: npm run build
